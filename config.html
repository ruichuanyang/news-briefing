<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>晨报设置</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f4f6f9; color: #1f2329; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 70px; }
  h1 { font-size: 20px; margin: 0 0 3px; }
  .sub { color: #8a9099; font-size: 12.5px; margin-bottom: 18px; }
  .card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 3px 14px rgba(0,0,0,.05); margin-bottom: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: #2b6cb0; }
  label { display: block; font-size: 12.5px; color: #6b7178; margin: 12px 0 5px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 10px 11px; border: 1px solid #e1e5ea; border-radius: 10px;
    font-size: 14px; font-family: inherit; background: #fbfcfd; color: #1f2329; }
  textarea { resize: vertical; min-height: 56px; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #2b6cb0; background: #fff; }
  .sec { border: 1px solid #eef0f3; border-radius: 12px; padding: 13px; margin-bottom: 11px; background: #fafbfc; }
  .hint { font-size: 12px; color: #9aa1a9; margin: -6px 0 11px; }
  .sec-top { display: flex; gap: 8px; align-items: center; }
  .sec-top input { flex: 1; font-weight: 600; }
  .x { flex: 0 0 auto; width: 34px; height: 34px; border: none; border-radius: 9px; background: #fdecea; color: #c0392b; font-size: 18px; cursor: pointer; line-height: 1; }
  .arrows { display: flex; flex-direction: column; gap: 5px; flex: 0 0 auto; }
  .mv { width: 36px; height: 22px; border: none; border-radius: 8px; background: #eef1f5; color: #2b6cb0; font-size: 16px; cursor: pointer; line-height: 1; padding: 0; }
  .mv:active { background: #dfe6ee; }
  .mv:disabled { opacity: .3; cursor: default; }
  .sec-bottom { display: flex; gap: 12px; align-items: flex-end; margin-top: 10px; }
  .sec-bottom > div:first-child { width: 92px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #1f2329; white-space: nowrap; margin: 0; }
  .chk input { width: auto; }
  button { cursor: pointer; border: none; border-radius: 10px; font-size: 14px; font-family: inherit; }
  .btn-primary { background: #2b6cb0; color: #fff; width: 100%; padding: 13px; font-size: 15px; margin-top: 4px; }
  .btn-primary:active { background: #245a93; }
  .btn-ghost { background: #eef1f5; color: #1f2329; width: 100%; padding: 12px; margin-top: 9px; }
  .btn-add { background: #eaf2fb; color: #2b6cb0; width: 100%; padding: 11px; margin-top: 2px; }
  .range-row { display: flex; align-items: center; gap: 12px; }
  .range-row input[type=range] { flex: 1; }
  .min-badge { flex: 0 0 auto; min-width: 86px; text-align: center; background: #eaf2fb; color: #2b6cb0;
               border-radius: 9px; padding: 7px 8px; font-size: 13px; font-weight: 600; }
  .token-note { font-size: 12px; color: #9aa1a9; background: #fff8e6; border: 1px solid #ffe7a3;
                padding: 9px 11px; border-radius: 10px; margin-bottom: 12px; }
  #status { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; display: none; }
  .ok { background: #e8f6ee; color: #1e7a44; }
  .err { background: #fdecea; color: #c0392b; }
</style>
</head>
<body>
<div class="wrap">
  <h1>晨报设置</h1>
  <div class="sub">只调你关心的：朗读声音、播报时长、各板块内容。</div>

  <div class="token-note">
    保存 / 立即生成需要 GitHub 授权。推荐点下方「用 GitHub 登录」一键授权，<b>不用复制任何令牌</b>；或用个人令牌 PAT 也行。凭证只存在你本机浏览器，只发给 api.github.com。
  </div>

  <div class="card">
    <h2>朗读声音</h2>
    <select id="voice">
      <option value="zh-CN-XiaoxiaoNeural">晓晓（女声·温柔，推荐）</option>
      <option value="zh-CN-YunxiNeural">云希（男声·清爽）</option>
      <option value="zh-CN-YunyangNeural">云扬（男声·沉稳新闻感）</option>
      <option value="zh-CN-XiaoyiNeural">晓伊（女声·甜美）</option>
      <option value="zh-CN-YunjianNeural">云健（男声）</option>
    </select>
  </div>

  <div class="card">
    <h2>播报时长</h2>
    <div class="range-row">
      <input type="range" id="duration" min="3" max="8" step="0.5">
      <span class="min-badge" id="minBadge">约 5.0 分钟</span>
    </div>
    <label>拖动调整整体播报长度（约 3–8 分钟）。</label>
  </div>

  <div class="card">
    <h2>新闻板块</h2>
    <div class="hint">点击板块右上角的 ▲▼ 调整顺序，从上到下的顺序就是每天播报的顺序。</div>
    <div id="sections"></div>
    <button class="btn-add" onclick="addSection()">＋ 添加板块</button>
  </div>

  <div class="card">
    <h2>GitHub 登录</h2>
    <div class="token-note" style="margin-bottom:10px">
      <b>方式一（推荐，免令牌）</b>：点「用 GitHub 登录」，会打开你的 GitHub 让你点一下授权即可。Client ID 已内置，无需填写。
    </div>
    <button class="btn-primary" style="background:#24292f;margin-top:8px" onclick="oauthLogin()">用 GitHub 登录（免令牌）</button>
    <div id="oauthHint" style="font-size:12px;color:#2b6cb0;margin-top:8px;display:none"></div>
    <label style="margin-top:14px">方式二（备选）：个人令牌 PAT</label>
    <input type="password" id="token" placeholder="ghp_xxx 或 github_pat_xxx">
    <label>含 <code>repo</code> 权限。点下方“记住令牌”后，下次自动填入。</label>
    <button class="btn-ghost" style="margin-top:6px" onclick="saveToken()">记住令牌</button>
  </div>

  <button class="btn-primary" onclick="saveAll()">保存修改</button>
  <button class="btn-ghost" onclick="runNow()">保存并立即生成一期</button>
  <div id="status"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const REPO = "ruichuanyang/news-briefing";
const CPS = 4.48; // 实测 XiaoxiaoNeural 语速：字/秒
let CONFIG = null;

// ---- UTF-8 安全的 base64 编解码（修掉旧版中文乱码的根因）----
function b64decodeUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, "")))); }
function b64encodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }

function saveToken() {
  const t = $("token").value.trim();
  if (!t) return showStatus("请输入令牌", false);
  localStorage.setItem("nb_token", t);
  showStatus("令牌已记住在本机浏览器。", true);
}
function loadToken() {
  const t = localStorage.getItem("nb_token"); if (t) $("token").value = t;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// GitHub OAuth Device Flow：用户点一下授权即可，无需复制粘贴令牌
const CLIENT_ID = "Ov23liyoN1ZoQk4zuh9l";
async function oauthLogin() {
  const cid = CLIENT_ID;
  let d;
  try {
    const r1 = await fetch("https://github.com/login/device/code", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ client_id: cid, scope: "repo" })
    });
    d = await r1.json();
    if (!d.device_code) return showStatus("获取设备码失败：" + (d.error_description || d.error || "未知错误"), false);
  } catch (e) { return showStatus("网络错误：" + e.message, false); }

  window.open(d.verification_uri, "_blank");
  const hint = $("oauthHint");
  hint.style.display = "block";
  hint.textContent = "已打开 GitHub 授权页，请输入代码：" + d.user_code + "（授权后本页会自动完成）";
  showStatus("请在打开的 GitHub 页面输入代码 " + d.user_code + " 并点授权。", true);

  let interval = (d.interval || 5) * 1000;
  for (let i = 0; i < 60; i++) {
    await sleep(interval);
    let t;
    try {
      const r2 = await fetch("https://github.com/login/oauth/access_token", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          client_id: cid, device_code: d.device_code,
          grant_type: "urn:ietf:params:oauth:grant-type:device_code"
        })
      });
      t = await r2.json();
    } catch (e) { continue; }
    if (t.access_token) {
      localStorage.setItem("nb_token", t.access_token);
      $("token").value = t.access_token;
      hint.style.display = "none";
      return showStatus("✅ 已用 GitHub 登录，现在可以直接保存 / 生成。", true);
    }
    if (t.error === "slow_down") interval += 5000;
    else if (t.error !== "authorization_pending") {
      hint.style.display = "none";
      return showStatus("登录失败：" + (t.error_description || t.error), false);
    }
  }
  hint.style.display = "none";
  showStatus("登录超时，请重试。", false);
}

function showStatus(msg, ok) {
  const el = $("status");
  el.textContent = msg;
  el.className = ok ? "ok" : "err";
  el.style.display = "block";
}

async function loadConfig() {
  const token = $("token").value.trim();
  const headers = { "Accept": "application/vnd.github+json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/config/topics.json`, { headers });
  if (!res.ok) throw new Error("读取配置失败：" + res.status);
  const data = await res.json();
  CONFIG = JSON.parse(b64decodeUtf8(data.content));
  CONFIG._sha = data.sha;
  // 朗读声音
  $("voice").value = (CONFIG.tts && CONFIG.tts.voice) || "zh-CN-XiaoxiaoNeural";
  // 时长：由 target_chars 反推分钟
  const mins = ((CONFIG.target_chars || 1300) / CPS / 60);
  $("duration").value = Math.min(8, Math.max(3, Math.round(mins * 2) / 2)).toFixed(1);
  updateBadge();
  renderSections();
}

function updateBadge() {
  const m = parseFloat($("duration").value || "5");
  $("minBadge").textContent = "约 " + m.toFixed(1) + " 分钟";
}
$("duration").addEventListener("input", updateBadge);

function collectInputs() {
  $("sections").querySelectorAll("input,textarea").forEach(el => {
    const i = +el.dataset.i, k = el.dataset.k;
    if (!k || !CONFIG.topics[i]) return;
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (k === "count") v = parseInt(v, 10) || 1;
    CONFIG.topics[i][k] = v;
  });
}
function renderSections() {
  const box = $("sections");
  box.innerHTML = "";
  (CONFIG.topics || []).forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "sec";
    div.dataset.i = i;
    div.innerHTML = `
      <div class="sec-top">
        <input type="text" data-k="name" data-i="${i}" value="${esc(t.name || "")}">
        <div class="arrows">
          <button class="mv" ${i === 0 ? "disabled" : ""} onclick="move(${i},-1)" title="上移">▲</button>
          <button class="mv" ${i === CONFIG.topics.length - 1 ? "disabled" : ""} onclick="move(${i},1)" title="下移">▼</button>
        </div>
        <button class="x" onclick="del(${i})" title="删除该板块">×</button>
      </div>
      <label>写作要点（告诉 AI 这个板块报什么）</label>
      <textarea data-k="instructions" data-i="${i}">${esc(t.instructions || "")}</textarea>
      <div class="sec-bottom">
        <div>
          <label>条数</label>
          <input type="number" min="1" max="10" data-k="count" data-i="${i}" value="${t.count || 4}">
        </div>
        <label class="chk"><input type="checkbox" data-k="enabled" data-i="${i}" ${t.enabled === false ? "" : "checked"}> 启用</label>
      </div>`;
    box.appendChild(div);
  });
  box.querySelectorAll("input,textarea").forEach(el => {
    el.addEventListener("input", () => {
      const i = +el.dataset.i, k = el.dataset.k;
      let v = el.type === "checkbox" ? el.checked : el.value;
      if (k === "count") v = parseInt(v, 10) || 1;
      CONFIG.topics[i][k] = v;
    });
  });
}
function del(i) { CONFIG.topics.splice(i, 1); renderSections(); }
function move(i, dir) {
  collectInputs();
  const j = i + dir;
  if (j < 0 || j >= CONFIG.topics.length) return;
  const arr = CONFIG.topics;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  renderSections();
}
function addSection() {
  CONFIG.topics.push({ name: "新板块", instructions: "报道该领域当日可靠、有新闻价值的动态。", search_query: "{short} 新闻", count: 4, enabled: true });
  renderSections();
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

async function saveAll() {
  if (!CONFIG) return showStatus("请稍候，配置还在加载。", false);
  const token = $("token").value.trim();
  if (!token) return showStatus("请先「用 GitHub 登录」或在 PAT 框填令牌。", false);
  // 只改用户关心的字段，其余（搜索词、时区等）原样保留
  CONFIG.target_chars = Math.round(parseFloat($("duration").value || "5") * CPS * 60);
  CONFIG.tts = CONFIG.tts || {};
  CONFIG.tts.provider = "edge";
  CONFIG.tts.voice = $("voice").value;
  const body = JSON.stringify(CONFIG, null, 2);
  const res = await fetch(`https://api.github.com/repos/${REPO}/contents/config/topics.json`, {
    method: "PUT",
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ message: "chore: 更新晨报设置（板块管理页）", content: b64encodeUtf8(body), sha: CONFIG._sha, branch: "main" })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) return showStatus("保存失败：" + (data.message || res.status), false);
  CONFIG._sha = data.content.sha;
  showStatus("✅ 已保存，下次晨报生效。", true);
}

async function runNow() {
  const token = $("token").value.trim();
  if (!token) return showStatus("请先「用 GitHub 登录」或在 PAT 框填令牌。", false);
  await saveAll();
  if (!$("status").className.includes("ok")) return;
  const res = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/morning-briefing.yml/dispatches`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify({ ref: "main" })
  });
  if (!res.ok) return showStatus("触发生成失败：" + res.status + "（需 repo 权限的授权）", false);
  showStatus("✅ 已保存并触发一期生成，约 1–2 分钟后微信收到推送。", true);
}

loadToken();
loadConfig().catch(e => showStatus("加载失败：" + e.message + "（公开仓库可直接打开；要保存请先「用 GitHub 登录」）", false));
</script>
</body>
</html>
