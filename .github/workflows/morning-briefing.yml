name: 每日 AI 晨报

on:
  schedule:
    # 23:00 UTC = 北京时间次日 07:00
    - cron: "0 23 * * *"
    # 23:30 UTC = 北京时间次日 07:30（双保险：07:00 被 GitHub 跳过/延迟时补上；
    # 脚本幂等——当天已发布则自动跳过，不会重复推送）
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新生成（忽略当天已发布，覆盖当天晨报）"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 生成并推送晨报
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REGEN: ${{ inputs.force || 'false' }}
        run: python src/morning_briefing.py
      - name: 保存本次生成记录（仅 Actions 保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-${{ github.run_id }}
          path: run-output.json
          if-no-files-found: ignore
          retention-days: 7
